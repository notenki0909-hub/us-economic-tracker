name: データ更新 & 公開

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # FREDの反映時刻（2026-10に実測。夏時間=CDT。冬時間（11/1〜）は1時間遅くなる）：
    #   各指標の発表（8:30 ET）  … 12:30〜13:30 UTC ごろ（例：PAYEMS 13:24、CPI 12:08）
    #   VIX（前営業日の終値）    … 13:37 UTC（冬時間 14:37）
    #   S&P500（当日の終値）     … 翌 00:01 UTC（冬時間 01:01）
    #   国債利回り・スプレッド（前営業日分） … 20:16〜21:03 UTC（冬時間 21:16〜22:03）
    # GitHub Actions の定期実行は予定より数時間遅れることがある（実測で2〜5時間）が、早まることはない。
    # そのため上記より後の時刻を指定し、遅れに頼らず取りこぼさないようにする。変更がなければコミットしない。
    #
    # 15:30 UTC（日本時間 翌0:30）月〜土：当日発表の指標・前営業日のVIXを反映（土曜は金曜分）。
    - cron: "30 15 * * 1-6"
    # 01:30 UTC（日本時間 10:30）火〜土：前日夕方（米時間）に出る S&P500 の当日終値・国債利回りを反映。
    - cron: "30 1 * * 2-6"
    # 14:00 UTC（日本時間 23:00）平日：マーケットボードの日経平均（FRED経由で当日分が 12:02 UTC ごろに反映）を取り込む。
    - cron: "0 14 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # push 以外（定期実行 / 手動）のときだけ FRED から取り直してコミット
      - name: 経済指標データを取得
        if: github.event_name != 'push'
        run: npm run fetch

      # FOMC・FRB講演などのイベント。公式ページの構造変更等で失敗しても、指標データの更新・公開は止めない
      - name: イベントデータを取得
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run fetch:events

      # 経済状況サマリー最上部のマーケットボード（主要6銘柄）。失敗しても指標データの更新・公開は止めない
      - name: マーケットボードのデータを取得
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run fetch:market

      - name: 変更があればコミット
        if: github.event_name != 'push'
        run: |
          git add public/data/*.json
          if ! git diff --cached --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(data): 経済指標データを更新 ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "データに変更なし"
          fi

  build-deploy:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # update-data がコミットした最新を取得

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
